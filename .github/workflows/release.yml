name: release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write

jobs:
  # Validates the tag, writes the changelog once and lists the Minecraft versions to publish.
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.list.outputs.versions }}
      version: ${{ steps.validate.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag matches version
        id: validate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          read -r VERSION CHANNEL_TAG < <(python3 -c '
          import tomllib

          with open("stonecutter.properties.toml", "rb") as f:
              mod = tomllib.load(f).get("mod", {})

          print(mod.get("version", ""), mod.get("channel_tag", ""))
          ')
          FULL_VERSION="${VERSION}${CHANNEL_TAG}"

          if [[ -z "$FULL_VERSION" ]]; then
            echo "::error::Could not read [mod].version from stonecutter.properties.toml."
            exit 1
          fi

          echo "Validating tag '$TAG' against version '$FULL_VERSION'..."
          if [[ "$TAG" != "$FULL_VERSION" ]]; then
            echo "::error::Tag '$TAG' does not match version '$FULL_VERSION' in stonecutter.properties.toml."

            if gh release view "$GITHUB_REF_NAME" &>/dev/null; then
              echo "Deleting GitHub release for $GITHUB_REF_NAME..."
              gh release delete "$GITHUB_REF_NAME" -y
            fi

            git push origin ":refs/tags/$GITHUB_REF_NAME"
            exit 1
          fi
          echo "✓ Tag matches version."
          echo "version=$FULL_VERSION" >> "$GITHUB_OUTPUT"

      - name: Prepare git-cliff
        run: |
          REPO_URL="https://github.com/${{ github.repository }}"
          sed -i "s|%%%repo_url%%%|${REPO_URL}|g" cliff.toml

      - name: Generate changelog with git-cliff
        uses: orhun/git-cliff-action@v4
        with:
          args: --latest --strip header --output CHANGELOG.md
          version: 'v2.13.1'

      - name: Upload changelog
        uses: actions/upload-artifact@v4
        with:
          name: changelog
          path: CHANGELOG.md

      - id: list
        run: echo "versions=$(python3 .github/scripts/versions.py)" >> "$GITHUB_OUTPUT"

  # One job per Minecraft version: builds its jars and publishes them to Modrinth and CurseForge.
  publish:
    name: Publish ${{ matrix.target.dir == 'legacy' && 'legacy ' || '' }}${{ matrix.target.version }}
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.prepare.outputs.versions) }}

    env:
      MOD_IS_RELEASE: true

    steps:
      - uses: actions/checkout@v4

      - name: Download changelog
        uses: actions/download-artifact@v4
        with:
          name: changelog
          # Both builds read the repository-root CHANGELOG.md
          path: .

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Build and publish to Modrinth and CurseForge
        working-directory: ${{ matrix.target.dir }}
        env:
          # The GitHub release is created once, by the github-release job
          PUB_GITHUB_ENABLE: 'false'
          PUB_DRY_RUN: ${{ vars.PUB_DRY_RUN }}
          PUB_MODS_ENABLE: ${{ vars.PUB_MODS_ENABLE || 'true' }}
          PUB_MODRINTH_STAGING: ${{ vars.PUB_MODRINTH_STAGING }}
          PUB_MODRINTH_PROJECT_ID: ${{ vars.PUB_MODRINTH_PROJECT_ID || 'v8gHddm5' }}
          PUB_CURSEFORGE_PROJECT_ID: ${{ vars.PUB_CURSEFORGE_PROJECT_ID }}
          PUB_MODRINTH_TOKEN: ${{ secrets.PUB_MODRINTH_TOKEN }}
          PUB_CURSEFORGE_TOKEN: ${{ secrets.PUB_CURSEFORGE_TOKEN }}
        run: |
          tasks=""
          for p in ${{ matrix.target.projects }}; do
            tasks="$tasks :$p:buildAndCollect :$p:publishMods"
          done
          ./gradlew $tasks -Pxcraft.versions=${{ matrix.target.version }} --stacktrace --console=plain

      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: jars-${{ matrix.target.dir == 'legacy' && 'legacy-' || '' }}${{ matrix.target.version }}
          path: ${{ matrix.target.dir }}/build/libs/**/*.jar

  # Creates the GitHub release with every jar once all versions are published.
  github-release:
    name: GitHub release
    needs: [ prepare, publish ]
    if: vars.PUB_DRY_RUN != 'true' && (vars.PUB_GITHUB_ENABLE || 'true') == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download changelog and jars
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          prerelease=""
          [[ "$VERSION" == *-* ]] && prerelease="--prerelease"
          gh release create "$GITHUB_REF_NAME" --title "xCraft $VERSION" --notes-file dist/CHANGELOG.md $prerelease \
            $(find dist -name '*.jar' | sort)
