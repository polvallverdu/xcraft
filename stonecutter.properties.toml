loomx.loom_version = "1.19.1"

[mod]
id = "xcraft"
name = "xCraft"
group = "dev.polv"
version = "2.1.0"
channel_tag = ""
description = "Multiply ore drops, mob drops, XP and furnace speed. Configurable, server-side, for Fabric, NeoForge & Forge."
authors = ["Pol Vallverdu"]
contributors = []
inception_year = "2024"
license.name = "Apache-2.0"
license.url = "https://www.apache.org/licenses/LICENSE-2.0"
license.dist = "repo"
environment = "server_only"
sources_url = "https://github.com/polvallverdu/xcraft"
homepage_url = "https://modrinth.com/mod/xcraft_real"
issues_url = "https://github.com/polvallverdu/xcraft/issues"
discord_url = ""
dev_jvm_args = [
	"-XX:+IgnoreUnrecognizedVMOptions",
	"-XX:+ShowCodeDetailsInExceptionMessages",
	"-Dfile.encoding=UTF-8"
]
dev_jvm_args_mixin_debug = [
	"-Dmixin.debug.countInjections=true"
]

[[mod.pom.developers]]
id = "polvallverdu"
name = "Pol Vallverdu"
url = "https://github.com/polvallverdu"

